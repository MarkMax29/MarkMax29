name: Generate Contribution Run

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate_contribution_run.py"
      - ".github/workflows/contribution-run.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate animated contribution SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: MarkMax29
        run: python scripts/generate_contribution_run.py

      - name: Commit refreshed SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-run.svg
          if git diff --cached --quiet; then
            echo "No contribution changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh contribution run"
          git push
