<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
<title id="title">Mark Digital Constellation</title>
<desc id="desc">Animated dark-blue constellation connecting Software, Embedded, Networking, Cybersecurity and AI/ML around Mark.</desc>

<defs>
  <radialGradient id="bg" cx="50%" cy="48%" r="72%">
    <stop offset="0%" stop-color="#0B2845"/>
    <stop offset="42%" stop-color="#071B2E"/>
    <stop offset="100%" stop-color="#0D1117"/>
  </radialGradient>

  <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#79C0FF" stop-opacity=".50"/>
    <stop offset="55%" stop-color="#1F6FEB" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="lineGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1F6FEB" stop-opacity=".28"/>
    <stop offset="50%" stop-color="#79C0FF" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#1F6FEB" stop-opacity=".28"/>
  </linearGradient>

  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>

  <style>
    .bg-star { fill:#79C0FF; opacity:.18; }
    .tw1 { animation: twinkle 3.2s ease-in-out infinite; }
    .tw2 { animation: twinkle 4.8s ease-in-out infinite 1s; }
    .tw3 { animation: twinkle 5.6s ease-in-out infinite 2s; }

    .const-line {
      fill:none;
      stroke:url(#lineGlow);
      stroke-width:1.6;
      stroke-linecap:round;
      stroke-dasharray:620;
      stroke-dashoffset:620;
      opacity:.72;
      animation: draw 8s ease-in-out infinite;
    }
    .l2 { animation-delay:.65s; }
    .l3 { animation-delay:1.3s; }
    .l4 { animation-delay:1.95s; }
    .l5 { animation-delay:2.6s; }

    .node-ring {
      fill:#0D1E30;
      stroke:#58A6FF;
      stroke-width:1.5;
      opacity:.92;
    }
    .node-dot {
      fill:#A5D6FF;
      filter:url(#glow);
      transform-box:fill-box;
      transform-origin:center;
      animation:pulse 3.4s ease-in-out infinite;
    }
    .n2 { animation-delay:.5s; }
    .n3 { animation-delay:1.0s; }
    .n4 { animation-delay:1.5s; }
    .n5 { animation-delay:2.0s; }

    .node-label {
      font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
      fill:#C9D1D9;
      font-size:13px;
      letter-spacing:1.3px;
    }
    .node-sub {
      font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
      fill:#6E9EC7;
      font-size:9px;
      letter-spacing:1px;
    }

    .mark-title {
      font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
      fill:#F0F6FC;
      font-size:31px;
      font-weight:700;
      letter-spacing:7px;
      animation:titleGlow 4s ease-in-out infinite;
    }
    .mark-sub {
      font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
      fill:#79C0FF;
      font-size:10px;
      letter-spacing:2.1px;
    }
    .tiny {
      font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;
      fill:#5D87AA;
      font-size:9px;
      letter-spacing:1.4px;
    }

    .orbit {
      fill:none;
      stroke:#58A6FF;
      stroke-width:1;
      stroke-dasharray:3 8;
      opacity:.25;
      transform-box:fill-box;
      transform-origin:center;
      animation:spin 24s linear infinite;
    }

    @keyframes draw {
      0%,8%   { stroke-dashoffset:620; opacity:.08; }
      35%,72% { stroke-dashoffset:0; opacity:.78; }
      92%,100%{ stroke-dashoffset:-620; opacity:.08; }
    }
    @keyframes twinkle {
      0%,100% { opacity:.10; transform:scale(.85); }
      50%     { opacity:.65; transform:scale(1.35); }
    }
    @keyframes pulse {
      0%,100% { transform:scale(.88); opacity:.72; }
      50%     { transform:scale(1.35); opacity:1; }
    }
    @keyframes titleGlow {
      0%,100% { opacity:.86; }
      50%     { opacity:1; }
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>

  <!-- Motion paths for traveling light particles -->
  <path id="p1" d="M550 210 C445 145 355 120 225 105"/>
  <path id="p2" d="M550 210 C445 260 350 300 220 315"/>
  <path id="p3" d="M550 210 C650 135 760 98 875 88"/>
  <path id="p4" d="M550 210 C690 210 785 212 915 214"/>
  <path id="p5" d="M550 210 C655 285 760 315 875 330"/>
</defs>

<!-- Background -->
<rect x="1" y="1" width="1098" height="418" rx="26" fill="url(#bg)" stroke="#173652"/>
<circle cx="550" cy="210" r="180" fill="url(#coreGlow)" opacity=".6"/>

<!-- Background star field -->
<g>
  <circle class="bg-star tw1" cx="72" cy="70" r="2"/>
  <circle class="bg-star tw2" cx="119" cy="165" r="1.6"/>
  <circle class="bg-star tw3" cx="163" cy="53" r="1.4"/>
  <circle class="bg-star tw1" cx="293" cy="62" r="1.7"/>
  <circle class="bg-star tw2" cx="353" cy="178" r="1.3"/>
  <circle class="bg-star tw3" cx="418" cy="82" r="1.5"/>
  <circle class="bg-star tw2" cx="492" cy="54" r="1.2"/>
  <circle class="bg-star tw1" cx="628" cy="72" r="1.6"/>
  <circle class="bg-star tw3" cx="710" cy="47" r="1.4"/>
  <circle class="bg-star tw1" cx="812" cy="156" r="1.6"/>
  <circle class="bg-star tw2" cx="1002" cy="77" r="1.7"/>
  <circle class="bg-star tw3" cx="1024" cy="194" r="1.2"/>
  <circle class="bg-star tw1" cx="965" cy="347" r="1.8"/>
  <circle class="bg-star tw2" cx="758" cy="373" r="1.2"/>
  <circle class="bg-star tw3" cx="666" cy="342" r="1.4"/>
  <circle class="bg-star tw1" cx="446" cy="366" r="1.5"/>
  <circle class="bg-star tw2" cx="337" cy="336" r="1.3"/>
  <circle class="bg-star tw3" cx="114" cy="355" r="1.7"/>
  <circle class="bg-star tw1" cx="57" cy="270" r="1.3"/>
  <circle class="bg-star tw2" cx="282" cy="218" r="1.1"/>
  <circle class="bg-star tw3" cx="790" cy="268" r="1.1"/>
  <circle class="bg-star tw1" cx="924" cy="138" r="1.1"/>
</g>

<!-- Decorative micro connections -->
<g stroke="#234C6B" stroke-width=".8" opacity=".28">
  <path d="M72 70 L163 53 L225 105"/>
  <path d="M119 165 L225 105 L293 62"/>
  <path d="M220 315 L114 355 L57 270"/>
  <path d="M875 88 L1002 77 L924 138"/>
  <path d="M915 214 L1024 194 L965 347 L875 330"/>
  <path d="M875 330 L758 373 L666 342"/>
</g>

<!-- Main constellation lines -->
<path class="const-line" d="M550 210 C445 145 355 120 225 105"/>
<path class="const-line l2" d="M550 210 C445 260 350 300 220 315"/>
<path class="const-line l3" d="M550 210 C650 135 760 98 875 88"/>
<path class="const-line l4" d="M550 210 C690 210 785 212 915 214"/>
<path class="const-line l5" d="M550 210 C655 285 760 315 875 330"/>

<!-- Moving particles -->
<g fill="#A5D6FF" filter="url(#glow)">
  <circle r="3.2">
    <animateMotion dur="6.2s" repeatCount="indefinite" begin=".3s"><mpath href="#p1"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="6.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2">
    <animateMotion dur="7.1s" repeatCount="indefinite" begin="1.1s"><mpath href="#p2"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="7.1s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2">
    <animateMotion dur="6.7s" repeatCount="indefinite" begin="1.8s"><mpath href="#p3"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="6.7s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2">
    <animateMotion dur="5.9s" repeatCount="indefinite" begin="2.4s"><mpath href="#p4"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="5.9s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2">
    <animateMotion dur="7.4s" repeatCount="indefinite" begin="3.0s"><mpath href="#p5"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="7.4s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- Center -->
<circle cx="550" cy="210" r="83" class="orbit"/>
<circle cx="550" cy="210" r="66" fill="#091929" stroke="#2F81F7" stroke-width="1.5"/>
<circle cx="550" cy="210" r="58" fill="none" stroke="#58A6FF" stroke-opacity=".18"/>
<circle cx="550" cy="210" r="5" fill="#A5D6FF" filter="url(#glow)">
  <animate attributeName="r" values="4.4;6.2;4.4" dur="3.2s" repeatCount="indefinite"/>
</circle>
<text x="550" y="202" text-anchor="middle" class="mark-title">MARK</text>
<text x="550" y="229" text-anchor="middle" class="mark-sub">COMPUTER ENGINEERING</text>
<text x="550" y="247" text-anchor="middle" class="tiny">BUILD · LEARN · CONNECT</text>

<!-- SOFTWARE -->
<g>
  <circle cx="225" cy="105" r="28" class="node-ring"/>
  <circle cx="225" cy="105" r="5" class="node-dot"/>
  <text x="225" y="153" text-anchor="middle" class="node-label">SOFTWARE</text>
  <text x="225" y="170" text-anchor="middle" class="node-sub">CODE / SYSTEMS</text>
</g>

<!-- EMBEDDED -->
<g>
  <circle cx="220" cy="315" r="28" class="node-ring"/>
  <circle cx="220" cy="315" r="5" class="node-dot n2"/>
  <text x="220" y="365" text-anchor="middle" class="node-label">EMBEDDED</text>
  <text x="220" y="382" text-anchor="middle" class="node-sub">HARDWARE + SOFTWARE</text>
</g>

<!-- NETWORKING -->
<g>
  <circle cx="875" cy="88" r="28" class="node-ring"/>
  <circle cx="875" cy="88" r="5" class="node-dot n3"/>
  <text x="875" y="136" text-anchor="middle" class="node-label">NETWORKING</text>
  <text x="875" y="153" text-anchor="middle" class="node-sub">INFRASTRUCTURE</text>
</g>

<!-- CYBERSECURITY -->
<g>
  <circle cx="915" cy="214" r="28" class="node-ring"/>
  <circle cx="915" cy="214" r="5" class="node-dot n4"/>
  <text x="915" y="262" text-anchor="middle" class="node-label">CYBERSECURITY</text>
  <text x="915" y="279" text-anchor="middle" class="node-sub">SECURITY / DEFENSE</text>
</g>

<!-- AI / ML -->
<g>
  <circle cx="875" cy="330" r="28" class="node-ring"/>
  <circle cx="875" cy="330" r="5" class="node-dot n5"/>
  <text x="875" y="378" text-anchor="middle" class="node-label">AI / ML</text>
  <text x="875" y="395" text-anchor="middle" class="node-sub">LEARNING / EXPLORING</text>
</g>

<!-- Corner micro-labels -->
<text x="34" y="392" class="tiny">DIGITAL CONSTELLATION // MARK.HORVATH</text>
<text x="1066" y="392" text-anchor="end" class="tiny">STATUS: EXPLORING</text>
</svg>